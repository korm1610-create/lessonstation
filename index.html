@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Zen+Old+Mincho:wght@700;900&family=Mochiy+Pop+One&family=Shippori+Mincho+B1:wght@700;800&family=Yuji+Syuku&family=Klee+One:wght@600&family=Yusei+Magic&family=M+PLUS+Rounded+1c:wght@700;800&family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');
.app{--paper:#F6F8F4;--ink:#24365C;--sub:#5C6780;--leaf:#4F8A6B;--marker:#FFE36E;--rule:#D6DCD2;
  font-family:'Zen Kaku Gothic New',sans-serif;color:var(--ink);background:var(--paper);min-height:100vh;padding:16px;line-height:1.7}
.app h1,.app h2,.app h3,.no,.pattern{font-family:'Zen Maru Gothic',sans-serif}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;max-width:760px;margin:0 auto 12px}
.top h1{font-size:1.25rem;font-weight:900;margin:0}
nav{display:flex;gap:4px}
button{font:inherit;border:1.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
nav button.on,.primary{background:var(--ink);color:#fff}
.small{padding:4px 12px;font-size:.85rem}
.ghost{border-color:var(--rule);color:var(--sub);padding:4px 10px;font-size:.85rem}
.link{border:none;background:none;text-align:left;padding:6px 0;font-weight:700}
.steps{display:flex;gap:4px;list-style:none;padding:0;max-width:760px;margin:0 auto 12px;overflow-x:auto}
.steps li{flex:1;min-width:64px;text-align:center;font-size:.75rem;padding:6px 2px;border-bottom:3px solid var(--rule);color:var(--sub);white-space:nowrap}
.steps li.done{border-color:var(--leaf);color:var(--leaf)}
.steps li.now{border-color:var(--ink);color:var(--ink);font-weight:700}
.panel{max-width:760px;margin:0 auto 20px;background:#fff;border:1.5px solid var(--rule);border-radius:14px;padding:16px}
.ph{font-size:1.1rem;margin:0 0 12px}
.panel label{display:block;font-size:.85rem;color:var(--sub);margin-bottom:10px}
.panel input:not([type=checkbox]),.panel select,.panel textarea,.line-edit input,.line-edit textarea{display:block;width:100%;box-sizing:border-box;margin-top:4px;font:inherit;color:var(--ink);border:1.5px solid var(--rule);border-radius:8px;padding:8px;background:var(--paper)}
.grid2{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.check{display:flex!important;align-items:center;gap:6px;margin:0!important;color:var(--ink)!important}
.hint{font-size:.85rem;color:var(--sub);margin:6px 0 10px}
.status{color:var(--leaf);font-weight:700;margin:10px 0 0}
.error{color:#B3261E;margin:10px 0 0}
.row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--rule)}
.pick{max-width:760px;margin:0 auto}
.bar{margin-bottom:8px}
.cand{background:#fff;border:1.5px solid var(--rule);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.cand-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cand-head h3{font-size:1rem;margin:0}
